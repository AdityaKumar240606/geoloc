<!DOCTYPE html>
<html>
<head>
  <title>Geo Demo</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
  <h1>My Location</h1>
  <button onclick="startTracking()">Start Tracking</button>
  <button onclick="stopTracking()">Stop Tracking</button>
  <p id="output">Click the button...</p>
  <div id ="others"></div>
  <div id="map" style="height: 400px; width: 100%; margin-top: 10px;"></div>
    <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const map = L.map("map").setView([22.3210, 87.3025], 15);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "© OpenStreetMap contributors"
    }).addTo(map);
    let myMarker = null;
    socket.on("connect", () => {
      console.log("Connected to server via Socket.IO");
    });

    const otherDevices = {};

    socket.on("location",(data)=>{
        otherDevices[data.id] = data;
        renderOthers();
    });

    function renderOthers(){
        const container = document.getElementById("others");
        container.innerHTML = "";
        for(const id in otherDevices){
            const d = otherDevices[id];
            const line = document.createElement("p");
            line.innerText = `Device ${id.slice(0, 5)}: ${d.latitude}, ${d.longitude} (±${d.accuracy}m) at ${d.timestamp}`;
            container.appendChild(line);
        }
    }

    let watchId = null;
    function startTracking() {
        const output = document.getElementById("output");
        if(!("geolocation" in navigator)){
            output.innerText = "Geolocation not supported";
            return;
        }
        watchId = navigator.geolocation.watchPosition(
            (pos) => {
                const { latitude, longitude, accuracy } = pos.coords;
                const timestamp = new Date(pos.timestamp).toLocaleTimeString();
                output.innerText = `Lat: ${latitude}, Lng: ${longitude} (±${accuracy}m), timestamp: ${timestamp}`;
                socket.emit("location", { latitude, longitude, accuracy, timestamp });
                if (myMarker === null) {
                    myMarker = L.marker([latitude, longitude]).addTo(map).bindPopup("You").openPopup();
                } else {
                    myMarker.setLatLng([latitude, longitude]);
                }
                map.setView([latitude, longitude], map.getZoom());
            },

            (err) =>{
                output.innerText = "Error: " + err.message;
            },
            { enableHighAccuracy: true, timeout: 10000 }
        );
    }

    function stopTracking() {
        if(watchId){
            navigator.geolocation.clearWatch(watchId);
            watchId = null;
        }
    }

  </script>
</body>
</html>
