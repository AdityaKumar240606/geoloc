<!DOCTYPE html>
<html>
<head>
  <title>Personal Tracker</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="index.css" />
</head>
<body>
  
  <div class="dashboard">
    <header>
      <h1>Location Tracker</h1>
    </header>

    <div class="glass-panel">
      <div class="controls">
        <button onclick="startTracking()">Start Tracking</button>
        <button class="stop-btn" onclick="stopTracking()">Stop Tracking</button>
      </div>

      <div class="stats">
        <h3>Live Status</h3>
        <p id="output">Ready. Click Start to begin tracking.</p>
      </div>

      <div class="stats" style="margin-top: 1rem;">
        <h3>Other Devices</h3>
        <div id="others">Waiting for connections...</div>
      </div>
    </div>
  </div>

  <div id="map"></div>
  
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const map = L.map("map", {zoomControl: false}).setView([22.3210, 87.3025], 15);
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    // Premium dark tile layer (CartoDB Dark Matter)
    L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
      attribution: '&copy; <a href="https://carto.com/">CARTO</a>'
    }).addTo(map);
    let myMarker = null;
    socket.on("connect", () => {
      console.log("Connected to server via Socket.IO");
    });

    const otherDevices = {};

    socket.on("location",(data)=>{
        otherDevices[data.id] = data;
        renderOthers();
    });

    function renderOthers(){
        const container = document.getElementById("others");
        container.innerHTML = "";
        for(const id in otherDevices){
            const d = otherDevices[id];
            const card = document.createElement("div");
            card.className = "device-card";
            card.innerText = `Device ${id.slice(0, 5)}: ${parseFloat(d.latitude).toFixed(4)}, ${parseFloat(d.longitude).toFixed(4)}`;
            container.appendChild(card);
        }
    }
    function getHaversineDistance(lat1, lon1, lat2, lon2) {
    const R = 6371000; // Earth's radius in meters
    const toRad = (deg) => (deg * Math.PI) / 180;

    const dLat = toRad(lat2 - lat1);
    const dLon = toRad(lon2 - lon1);

    const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);

    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return R * c; // Distance in meters
    }

    let lastPosition = null;
    const DISTANCE_THRESHOLD_METERS = 10;
    let watchId = null;

    function startTracking() {
        const output = document.getElementById("output");
        if(!("geolocation" in navigator)){return;}

        watchId = navigator.geolocation.watchPosition(
            (pos) => {
                const { latitude, longitude, accuracy } = pos.coords;
                if (accuracy > 20) return;
                const timestamp = new Date(pos.timestamp).toLocaleTimeString();
                if (lastPosition) {
                const movedMeters = getHaversineDistance(lastPosition.latitude,lastPosition.longitude,latitude,longitude);
                if (movedMeters < DISTANCE_THRESHOLD_METERS) {return; }
                }

                output.innerText = `Lat: ${latitude}, Lng: ${longitude} (±${accuracy}m), timestamp: ${timestamp}`;
                lastPosition = { latitude, longitude };
                
                socket.emit("location", { latitude, longitude, accuracy, timestamp });


                if (myMarker === null) {
                    myMarker = L.marker([latitude, longitude]).addTo(map).bindPopup("You").openPopup();
                } else {
                    myMarker.setLatLng([latitude, longitude]);
                }
                map.setView([latitude, longitude], map.getZoom());
            },

            (err) =>{
                output.innerText = "Error: " + err.message;
            },
            { enableHighAccuracy: true, timeout: 30000 }
        );
    }

    function stopTracking() {
        if(watchId){
            navigator.geolocation.clearWatch(watchId);
            watchId = null;
        }
    }

  </script>
</body>
</html>
